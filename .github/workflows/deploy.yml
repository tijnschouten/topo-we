name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci

      - name: Cache geography sources and prepared maps
        uses: actions/cache@v4
        with:
          path: |
            .cache/topo-geo
            public/geo
            src/data/referenceCatalog.json
          key: geography-${{ runner.os }}-${{ hashFiles('scripts/prepare_geo.py', 'scripts/geo-requirements.txt') }}
          restore-keys: |
            geography-${{ runner.os }}-

      - name: Prepare source geometries
        run: |
          pip install -r scripts/geo-requirements.txt
          npm run prepare:geo -- --cache-dir .cache/topo-geo
          npm run test:geo

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
